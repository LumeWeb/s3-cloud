# Marketplace release dispatcher: resolves target vendors and fans out to
# per-vendor release workflows.
#
# Each per-vendor workflow (packer-release-<vendor>.yml) handles its own
# build → validate → submit pipeline independently. One vendor failing
# does NOT affect the other.
#
# Release snapshots use the bare prefix (pinner-s3-<vendor>-<timestamp>)
# and are persistent (not cleaned up by CI).

name: Marketplace Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Target vendor (digitalocean, vultr, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'digitalocean'
          - 'vultr'
      reason:
        description: 'Reason for update (shown in Vendor Portal / Console)'
        required: false
        default: 'Automated release'
        type: string
      version:
        description: 'App version string (e.g. 1.0.0)'
        required: true
        type: string

env:
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
  RELEASE_REASON: ${{ github.event.inputs.reason || 'Automated release' }}

concurrency:
  group: marketplace-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-vendors:
    runs-on: ubuntu-latest
    outputs:
      vendors: ${{ steps.resolve.outputs.vendors }}
      version: ${{ steps.resolve.outputs.version }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Resolve vendor list and release params
        id: resolve
        run: |
          INPUT="${{ github.event.inputs.vendor || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            echo 'vendors=["digitalocean","vultr"]' >> "$GITHUB_OUTPUT"
          else
            echo "vendors=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "reason=${RELEASE_REASON}" >> "$GITHUB_OUTPUT"

  dispatch-digitalocean:
    needs: resolve-vendors
    if: contains(needs.resolve-vendors.outputs.vendors, 'digitalocean')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Dispatch DigitalOcean Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve-vendors.outputs.version }}
          REASON: ${{ needs.resolve-vendors.outputs.reason }}
        run: |
          gh workflow run packer-release-digitalocean.yml \
            --ref "$REF" \
            -f version="$VERSION" \
            -f reason="$REASON"
          echo "Dispatched Release DigitalOcean on ref $REF"

  dispatch-vultr:
    needs: resolve-vendors
    if: contains(needs.resolve-vendors.outputs.vendors, 'vultr')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Dispatch Vultr Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve-vendors.outputs.version }}
          REASON: ${{ needs.resolve-vendors.outputs.reason }}
        run: |
          gh workflow run packer-release-vultr.yml \
            --ref "$REF" \
            -f version="$VERSION" \
            -f reason="$REASON"
          echo "Dispatched Release Vultr on ref $REF"

  summary:
    needs: [resolve-vendors, dispatch-digitalocean, dispatch-vultr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## Marketplace Release"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | ${{ needs.resolve-vendors.outputs.version }} |"
            echo "| Reason | ${{ needs.resolve-vendors.outputs.reason }} |"
            echo "| DigitalOcean | ${{ needs.dispatch-digitalocean.result }} |"
            echo "| Vultr | ${{ needs.dispatch-vultr.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
