# Multi-arch Docker image build pipeline for the s3-server update sidecar
#
# Builds one image for linux/amd64 and linux/arm64:
#   ghcr.io/lumeweb/s3-server-updater — auto-update sidecar
#
# The main s3-server image is built and published by the LumeWeb/s3-server
# repo's own CI. This workflow only builds the sidecar.
#
# Triggers:
#   - Push to develop
#   - Tag push matching v* (semver)
#   - Pull request (validates builds without pushing)
#   - Manual workflow_dispatch
#
# Tagging strategy (via docker/metadata-action):
#   - latest               (on default branch)
#   - git SHA short         (always)
#   - branch name           (on branch push)
#   - semver                (on tag push: v1.0.0 → 1.0.0)

name: Build & Publish Sidecar Image

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to build'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  UPDATER_IMAGE: ghcr.io/lumeweb/s3-server-updater

# Prevent concurrent builds racing on the same image tags and cache refs.
# Newer runs cancel in-progress runs for the same ref.
concurrency:
  group: docker-build-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # ── Checkout: this repo (sidecar source) ────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      # ── QEMU: cross-platform emulation (arm64 on amd64 runner) ───────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      # ── Buildx: multi-platform builder instance ──────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          platforms: linux/amd64,linux/arm64

      # ── GHCR login using GITHUB_TOKEN ───────────────────────────────────
      - name: Log in to GHCR
        # Skip login on pull requests — image push is disabled for PR builds.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Metadata: automatic tag generation ───────────────────────────────
      - name: Extract metadata (updater sidecar)
        id: meta-updater
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.UPDATER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=s3-server-updater
            org.opencontainers.image.description=Auto-update sidecar — polls GHCR for new digests and recreates s3-server
            org.opencontainers.image.licenses=MIT

      # ── Build & push: s3-server-updater sidecar (amd64 + arm64) ──────────
      # The sidecar Dockerfile is based on docker:29-cli (Alpine) and bundles
      # updater.sh. Lightweight — no CGO, no cross-compiler needed.
      - name: Build and push updater sidecar image
        uses: docker/build-push-action@v7
        with:
          context: ./sidecar
          file: ./sidecar/Dockerfile.updater
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-updater.outputs.tags }}
          labels: ${{ steps.meta-updater.outputs.labels }}
          cache-from: |
            type=gha,scope=updater
          cache-to: |
            type=gha,scope=updater,mode=max
          provenance: true
          sbom: true

      # ── Summary ─────────────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          {
            echo "## Docker Image Published"
            echo ""
            echo "### s3-server-updater"
            echo '```'
            echo "${{ steps.meta-updater.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
