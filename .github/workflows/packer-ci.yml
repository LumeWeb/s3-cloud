# PR CI dispatcher: detects changed vendors and fans out to per-vendor workflows.
#
# This workflow is intentionally thin — it only:
#   1. Detects which vendor directories changed
#   2. Checks collaborator permissions (gates cloud spend)
#   3. Runs lint (informational, does not block builds)
#   4. Dispatches per-vendor CI workflows (packer-ci-<vendor>.yml)
#
# Each per-vendor workflow runs independently with its own build → validate → cleanup.
# One vendor failing does NOT affect the other.
#
# Cleanup behavior:
#   - PR opened/synchronized: build + validate (snapshot kept until PR closes)
#   - PR closed: cleanup only (delete snapshots matching pinner-s3-<vendor>-pr-<PR>-*)
#   - Push to develop: build + validate + cleanup (ephemeral, prefix -ci-*)
#   - Manual dispatch: build + validate (configurable cleanup)

name: Packer CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'deploy/**'
      - 'packer/scripts/**'
      - 'scripts/**'
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - develop
    paths:
      - 'deploy/**'
      - 'packer/scripts/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor to build (digitalocean, vultr, aws, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'digitalocean'
          - 'vultr'
          - 'aws'
      skip-cleanup:
        description: 'Skip cleanup after build (keep snapshot for manual testing)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      rescue-password:
        description: 'Set root password for serial console rescue access (AWS debug only)'
        required: false
        type: string

concurrency:
  group: packer-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-vendors:
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    outputs:
      vendors: ${{ steps.detect.outputs.vendors }}
      is-closed: ${{ steps.detect.outputs.is-closed }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect vendors from changed files
        id: detect
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          # PR close: cleanup all vendors
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_EVENT_ACTION" = "closed" ]; then
            echo 'vendors=["digitalocean","vultr","aws"]' >> "$GITHUB_OUTPUT"
            echo "is-closed=true" >> "$GITHUB_OUTPUT"
            echo "Detected vendors (PR close): all"
            exit 0
          fi
          echo "is-closed=false" >> "$GITHUB_OUTPUT"

          # Manual dispatch: use the input
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.vendor }}"
            if [ "$INPUT" = "all" ]; then
              echo 'vendors=["digitalocean","vultr","aws"]' >> "$GITHUB_OUTPUT"
            else
              echo "vendors=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Push or PR: detect from changed files
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DIFF_RANGE="HEAD~1..HEAD"
          else
            DIFF_RANGE="origin/develop...HEAD"
          fi

          CHANGED=$(git diff --name-only "$DIFF_RANGE")
          VENDORS=""

          if echo "$CHANGED" | grep -q '^deploy/digitalocean/'; then
            VENDORS="${VENDORS}digitalocean "
          fi
          if echo "$CHANGED" | grep -q '^deploy/vultr/'; then
            VENDORS="${VENDORS}vultr "
          fi
          if echo "$CHANGED" | grep -q '^deploy/aws/'; then
            VENDORS="${VENDORS}aws "
          fi

          # Shared files affect ALL vendors — add them additively.
          if echo "$CHANGED" | grep -qE '^(packer/scripts/|deploy/shared/|docker-compose\.yml|sidecar/)'; then
            if ! echo "$VENDORS" | grep -q 'digitalocean'; then
              VENDORS="${VENDORS}digitalocean "
            fi
            if ! echo "$VENDORS" | grep -q 'vultr'; then
              VENDORS="${VENDORS}vultr "
            fi
            if ! echo "$VENDORS" | grep -q 'aws'; then
              VENDORS="${VENDORS}aws "
            fi
          fi

          # Build JSON array from space-separated list
          JSON="["
          FIRST=true
          for V in $VENDORS; do
            if [ "$FIRST" = "true" ]; then
              JSON="${JSON}\"$V\""
              FIRST=false
            else
              JSON="${JSON},\"$V\""
            fi
          done
          JSON="${JSON}]"

          echo "vendors=$JSON" >> "$GITHUB_OUTPUT"
          echo "Detected vendors: $JSON"

  check-permissions:
    if: always() && !cancelled()
    needs: detect-vendors
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check if actor is a collaborator
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.triggering_actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: |
          # PR close: always authorized (cleanup only, no cloud spend)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_EVENT_ACTION" = "closed" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null | grep -qE 'admin|write|maintain'; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Build skipped: ${ACTOR} is not a collaborator"
          fi

  lint:
    needs: detect-vendors
    if: github.event.action != 'closed' && needs.detect-vendors.outputs.vendors != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        vendor: ${{ fromJson(needs.detect-vendors.outputs.vendors) }}
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: Packer init
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init deploy/${{ matrix.vendor }}/

      - name: Packer format check
        run: packer fmt -check deploy/${{ matrix.vendor }}/

      - name: Packer syntax validate
        run: packer validate -syntax-only deploy/${{ matrix.vendor }}/template.pkr.hcl

      - name: Shellcheck (vendor-specific)
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: >-
            deploy/${{ matrix.vendor }}/scripts/900-cleanup.sh
            deploy/${{ matrix.vendor }}/scripts/validate.sh
            deploy/${{ matrix.vendor }}/scripts/001_provision.sh

      - name: Shellcheck (DO application-tag, digitalocean only)
        if: matrix.vendor == 'digitalocean'
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: >-
            deploy/digitalocean/scripts/020-application-tag.sh

      - name: Shellcheck (shared)
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: >-
            deploy/shared/scripts/014-ufw-s3.sh
            deploy/shared/scripts/018-force-ssh-logout.sh
            deploy/shared/scripts/lib/compliance-checks.sh
            deploy/shared/files/var/lib/cloud/scripts/per-instance/001_onboot
            deploy/shared/files/etc/update-motd.d/99-one-click

      - name: Shellcheck (repo-level AWS validator)
        if: matrix.vendor == 'aws'
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: 'scripts/validate-aws.sh'

      - name: Python compile check
        run: python3 -m py_compile deploy/${{ matrix.vendor }}/submit.py deploy/${{ matrix.vendor }}/scripts/prune-snapshots.py deploy/${{ matrix.vendor }}/scripts/prune-instances.py

      - name: Makefile syntax check
        run: make -C deploy/${{ matrix.vendor }} -n all

  # Dispatch per-vendor CI workflows. Each runs independently.
  dispatch-digitalocean:
    needs: [detect-vendors, check-permissions]
    if: always() && !cancelled() && needs.check-permissions.outputs.authorized == 'true' && contains(needs.detect-vendors.outputs.vendors, 'digitalocean')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Determine snapshot prefix and cleanup mode
        id: config
        run: |
          if [ "${{ needs.detect-vendors.outputs.is-closed }}" = "true" ]; then
            echo "cleanup-mode=close" >> "$GITHUB_OUTPUT"
            echo "snapshot-prefix=pinner-s3-do-pr-${{ github.event.pull_request.number }}-" >> "$GITHUB_OUTPUT"
            echo "pr-number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "cleanup-mode=inline" >> "$GITHUB_OUTPUT"
            echo "snapshot-prefix=pinner-s3-do-ci-" >> "$GITHUB_OUTPUT"
            echo "pr-number=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.skip-cleanup }}" = "false" ]; then
              echo "cleanup-mode=inline" >> "$GITHUB_OUTPUT"
            else
              echo "cleanup-mode=none" >> "$GITHUB_OUTPUT"
            fi
            echo "snapshot-prefix=pinner-s3-do-manual-" >> "$GITHUB_OUTPUT"
            echo "pr-number=" >> "$GITHUB_OUTPUT"
          else
            echo "cleanup-mode=none" >> "$GITHUB_OUTPUT"
            echo "snapshot-prefix=pinner-s3-do-pr-${{ github.event.pull_request.number }}-" >> "$GITHUB_OUTPUT"
            echo "pr-number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch DigitalOcean CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ (github.event_name == 'pull_request' && github.event.action == 'closed') && github.base_ref || github.head_ref || github.ref_name }}
          SNAPSHOT_PREFIX: ${{ steps.config.outputs.snapshot-prefix }}
          CLEANUP_MODE: ${{ steps.config.outputs.cleanup-mode }}
          PR_NUMBER: ${{ steps.config.outputs.pr-number }}
        run: |
          gh workflow run packer-ci-digitalocean.yml \
            --ref "$REF" \
            -f snapshot-prefix="$SNAPSHOT_PREFIX" \
            -f cleanup-mode="$CLEANUP_MODE" \
            -f pr-number="$PR_NUMBER"
          echo "Dispatched CI DigitalOcean on ref $REF"

  dispatch-vultr:
    needs: [detect-vendors, check-permissions]
    if: always() && !cancelled() && needs.check-permissions.outputs.authorized == 'true' && contains(needs.detect-vendors.outputs.vendors, 'vultr')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Determine snapshot prefix and cleanup mode
        id: config
        run: |
          if [ "${{ needs.detect-vendors.outputs.is-closed }}" = "true" ]; then
            echo "cleanup-mode=close" >> "$GITHUB_OUTPUT"
            echo "snapshot-prefix=pinner-s3-vultr-pr-${{ github.event.pull_request.number }}-" >> "$GITHUB_OUTPUT"
            echo "pr-number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "cleanup-mode=inline" >> "$GITHUB_OUTPUT"
            echo "snapshot-prefix=pinner-s3-vultr-ci-" >> "$GITHUB_OUTPUT"
            echo "pr-number=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.skip-cleanup }}" = "false" ]; then
              echo "cleanup-mode=inline" >> "$GITHUB_OUTPUT"
            else
              echo "cleanup-mode=none" >> "$GITHUB_OUTPUT"
            fi
            echo "snapshot-prefix=pinner-s3-vultr-manual-" >> "$GITHUB_OUTPUT"
            echo "pr-number=" >> "$GITHUB_OUTPUT"
          else
            echo "cleanup-mode=none" >> "$GITHUB_OUTPUT"
            echo "snapshot-prefix=pinner-s3-vultr-pr-${{ github.event.pull_request.number }}-" >> "$GITHUB_OUTPUT"
            echo "pr-number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Vultr CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ (github.event_name == 'pull_request' && github.event.action == 'closed') && github.base_ref || github.head_ref || github.ref_name }}
          SNAPSHOT_PREFIX: ${{ steps.config.outputs.snapshot-prefix }}
          CLEANUP_MODE: ${{ steps.config.outputs.cleanup-mode }}
          PR_NUMBER: ${{ steps.config.outputs.pr-number }}
        run: |
          gh workflow run packer-ci-vultr.yml \
            --ref "$REF" \
            -f snapshot-prefix="$SNAPSHOT_PREFIX" \
            -f cleanup-mode="$CLEANUP_MODE" \
            -f pr-number="$PR_NUMBER"
          echo "Dispatched CI Vultr on ref $REF"

  dispatch-aws:
    needs: [detect-vendors, check-permissions]
    if: always() && !cancelled() && needs.check-permissions.outputs.authorized == 'true' && contains(needs.detect-vendors.outputs.vendors, 'aws') && needs.detect-vendors.outputs.is-closed != 'true'
    uses: ./.github/workflows/packer-ci-aws.yml
    secrets: inherit
    with:
      snapshot-prefix: pinner-s3-aws-pr-${{ github.event.pull_request.number }}-
      cleanup-mode: none
      pr-number: ${{ github.event.pull_request.number }}
      rescue-password: ${{ github.event.inputs.rescue-password }}

